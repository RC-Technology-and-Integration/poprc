name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Compilar frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: poprc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poprc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/poprc_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      APP_UPLOAD_DIR: ${{ github.workspace }}/target/test-uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Validar scripts de implantacao
        run: bash -n deploy/scripts/*.sh

      - name: Executar testes
        run: ./mvnw --batch-mode test

  containers:
    name: Containers Dokploy
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://postgres:5432/poprc
      DB_USERNAME: poprc
      DB_PASSWORD: senha-de-validacao-do-compose
      APP_PUBLIC_URL: https://homologacao.exemplo.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar Docker Compose
        run: docker compose -f compose.dokploy.yml config --quiet

      - name: Construir imagem do backend
        run: docker build --file deploy/docker/backend.Dockerfile --tag poprc-backend:ci .

      - name: Construir imagem do frontend
        run: >-
          docker build
          --file deploy/docker/frontend.Dockerfile
          --build-arg VITE_APP_REVISION=${GITHUB_SHA::8}
          --tag poprc-frontend:ci
          .

      - name: Validar Nginx do frontend
        run: docker run --rm --add-host backend:127.0.0.1 poprc-frontend:ci nginx -t
